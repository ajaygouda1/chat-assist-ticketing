version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: chatassist_postgres
    environment:
      POSTGRES_USER: chatassist
      POSTGRES_PASSWORD: chatassist_password_2026
      POSTGRES_DB: chatassist_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatassist -d chatassist_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chatassist_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatassist_backend
    environment:
      DATABASE_URL: postgresql://chatassist:chatassist_password_2026@postgres:5432/chatassist_prod
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: super-secret-key-chatassist-2026
      ENV: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatassist_worker
    command: python -m app.workers.job_worker
    environment:
      DATABASE_URL: postgresql://chatassist:chatassist_password_2026@postgres:5432/chatassist_prod
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: super-secret-key-chatassist-2026
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatassist_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
